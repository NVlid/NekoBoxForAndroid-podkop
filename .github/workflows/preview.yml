name: Preview Build
on:
  workflow_dispatch:
    inputs:
jobs:
  protocols:
    name: Embedded protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.x'
      - run: python3 -m pip install sshuttle==1.3.2
      - name: Build original dnscat2 client for compatibility test
        run: |
          curl --fail --location https://codeload.github.com/iagox86/dnscat2/tar.gz/refs/tags/v0.07 | tar -xz -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/dnscat2-0.07/client"
          echo "DNSCAT2_C_CLIENT=$RUNNER_TEMP/dnscat2-0.07/client/dnscat" >> "$GITHUB_ENV"
      - name: Tests including upstream sshuttle server
        working-directory: dnscat2
        env:
          SSHUTTLE_TEST_PYTHON: python3
        run: go test -race ./... -count=3 -timeout=120s
      - name: Build companion for Linux
        working-directory: dnscat2
        run: go build -trimpath -o dnscat2-companion ./cmd/dnscat2-companion
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dnscat2-companion-linux-amd64
          path: dnscat2/dnscat2-companion
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Golang Status
        run: |
          { find buildScript -type f -name '*.sh' ! -name assets.sh
            find libcore -maxdepth 1 -type f -name '*.sh'; } | sort | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore dnscat2 | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # gomobile-matsuri (master2) is incompatible with Go 1.27+
          # (GODEBUG gotypesalias removal), so pin to the 1.26 line.
          go-version: '1.26.x'
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SSHUTTLE_TEST_PYTHON: python3
        run: |
          python3 -m pip install sshuttle==1.3.2
          ./run lib core
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
      - protocols
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup JDK
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Golang Status
        run: |
          { find buildScript -type f -name '*.sh' ! -name assets.sh
            find libcore -maxdepth 1 -type f -name '*.sh'; } | sort | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore dnscat2 | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('golang_status', 'libcore_status') }}
      - name: Gradle cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease --stacktrace
          # debug-signed variant, installable without any keystore secrets
          ./gradlew app:assembleOssDebug --stacktrace
          ./gradlew app:testOssDebugUnitTest --stacktrace
      - name: Export generated Room schema
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Room-schemas
          path: app/schemas
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: APKs
          path: app/build/outputs/apk
